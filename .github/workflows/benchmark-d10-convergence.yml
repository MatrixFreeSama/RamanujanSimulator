name: D10 convergence certificate

on:
  pull_request:
    branches: [ main ]

jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install GMP
        run: sudo apt-get update && sudo apt-get install -y build-essential libgmp-dev
      - name: Run exact D10 certificate
        run: make d10convergencebench
