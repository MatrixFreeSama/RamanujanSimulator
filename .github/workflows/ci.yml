name: C17 reproducibility

on:
  push:
  pull_request:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgmp-dev libjson-c-dev
      - name: Build portable C17 binaries
        run: make NATIVE=0
      - name: Verify certificate restore and original explicit seed output
        run: make NATIVE=0 smoke
      - name: Exercise Newton precision-doubling trace
        run: make NATIVE=0 trace1000
      - name: Benchmark modular dimension sweet spot
        run: make NATIVE=0 dimensionbench
