name: C17 reproducibility

on:
  push:
  pull_request:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgmp-dev libjson-c-dev
      - name: Build portable C17 binaries
        run: make NATIVE=0
      - name: Generate constructive certificate and restore 1000 digits
        run: make NATIVE=0 smoke
