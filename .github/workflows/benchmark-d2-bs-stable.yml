name: D2 BS stable benchmark

on:
  pull_request:
    branches: [ main ]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libgmp-dev
      - name: Build baseline and optimized D2 BS
        run: |
          mkdir -p build
          git fetch origin main --depth=1
          git show origin/main:validation/benchmark_d2_bs_vs_classics.c > build/benchmark_d2_bs_baseline.c
          gcc -O3 -march=native -std=c17 -Wall -Wextra -Wpedantic \
            -Isrc -Ivalidation validation/benchmark_d2_bs_vs_classics.c \
            src/ramanujan_c_common.c -lgmp -lm \
            -o build/d2_bs_optimized
          gcc -O3 -march=native -std=c17 -Wall -Wextra -Wpedantic \
            -Isrc -Ivalidation build/benchmark_d2_bs_baseline.c \
            src/ramanujan_c_common.c -lgmp -lm \
            -o build/d2_bs_baseline
      - name: Run warm paired samples on tmpfs
        run: |
          set -euo pipefail
          rm -rf /dev/shm/rj_d2_bench
          mkdir -p /dev/shm/rj_d2_bench/build
          cp build/d2_bs_optimized build/d2_bs_baseline /dev/shm/rj_d2_bench/
          cd /dev/shm/rj_d2_bench

          # Warm allocator, code pages, and GMP dispatch before timed samples.
          ./d2_bs_baseline 100000 >/dev/null
          ./d2_bs_optimized 100000 >/dev/null

          echo 'variant,digits,chud_seconds,chud_terms,d2_seconds,d2_terms,d2_over_chud,equal' > raw.csv
          for n in 100000 300000 1000000; do
            for r in $(seq 1 9); do
              if [ $((r % 2)) -eq 1 ]; then
                b=$(./d2_bs_baseline "$n" | tail -n 1)
                o=$(./d2_bs_optimized "$n" | tail -n 1)
              else
                o=$(./d2_bs_optimized "$n" | tail -n 1)
                b=$(./d2_bs_baseline "$n" | tail -n 1)
              fi
              echo "baseline,$b" >> raw.csv
              echo "optimized,$o" >> raw.csv
            done
          done

          median_col() {
            local variant=$1 digits=$2 col=$3
            awk -F, -v v="$variant" -v n="$digits" -v c="$col" '$1==v && $2==n {print $c}' raw.csv | sort -n | sed -n '5p'
          }
          mad_col() {
            local variant=$1 digits=$2 col=$3 med=$4
            awk -F, -v v="$variant" -v n="$digits" -v c="$col" -v m="$med" '$1==v && $2==n {d=$c-m; if(d<0)d=-d; print d}' raw.csv | sort -n | sed -n '5p'
          }

          echo 'variant,digits,chud_median_s,chud_mad_s,d2_median_s,d2_mad_s,ratio_median,ratio_mad' > summary.csv
          for v in baseline optimized; do
            for n in 100000 300000 1000000; do
              cm=$(median_col "$v" "$n" 3)
              dm=$(median_col "$v" "$n" 5)
              rm=$(median_col "$v" "$n" 7)
              cmad=$(mad_col "$v" "$n" 3 "$cm")
              dmad=$(mad_col "$v" "$n" 5 "$dm")
              rmad=$(mad_col "$v" "$n" 7 "$rm")
              echo "$v,$n,$cm,$cmad,$dm,$dmad,$rm,$rmad" >> summary.csv
            done
          done

          cat summary.csv
          cp raw.csv summary.csv "$GITHUB_WORKSPACE/build/"
      - name: Upload stable benchmark tables
        uses: actions/upload-artifact@v4
        with:
          name: d2-bs-stable
          path: |
            build/raw.csv
            build/summary.csv
