name: D2 BS stable benchmark

on:
  pull_request:
    branches: [ main ]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libgmp-dev
      - name: Build stable benchmark
        run: |
          mkdir -p build
          gcc -O3 -march=native -std=c17 -Wall -Wextra -Wpedantic \
            -Isrc -Ivalidation validation/benchmark_d2_bs_stable.c \
            src/ramanujan_c_common.c -lgmp -lm \
            -o build/benchmark_d2_bs_stable
      - name: Run paired median benchmark
        run: |
          build/benchmark_d2_bs_stable 100000 300000 1000000 | tee build/d2_bs_stable.csv
      - name: Upload benchmark table
        uses: actions/upload-artifact@v4
        with:
          name: d2-bs-stable
          path: build/d2_bs_stable.csv
