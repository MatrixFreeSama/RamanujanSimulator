name: 1M low-order explicit pi benchmark

on:
  pull_request:
    branches: [ main ]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libgmp-dev
      - name: Build benchmark
        run: |
          mkdir -p build
          gcc -O3 -march=native -std=c17 -Wall -Wextra -Wpedantic \
            -Isrc validation/benchmark_low_order_explicit_vs_chud.c \
            src/ramanujan_c_common.c -lgmp -lm \
            -o build/benchmark_low_order_explicit_vs_chud
      - name: Run 100k 300k 1M benchmark
        run: |
          build/benchmark_low_order_explicit_vs_chud 100000 300000 1000000 | tee build/low_order_1m.csv
      - name: Upload benchmark table
        uses: actions/upload-artifact@v4
        with:
          name: low-order-1m
          path: build/low_order_1m.csv
