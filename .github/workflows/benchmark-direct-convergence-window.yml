name: Direct convergence-window benchmark

on:
  pull_request:
    branches: [ main ]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libgmp-dev
      - name: Build CWDR benchmark
        run: |
          mkdir -p build
          gcc -O3 -march=native -std=c17 -Wall -Wextra -Wpedantic \
            -Isrc -Ivalidation validation/benchmark_direct_convergence_window.c \
            src/ramanujan_c_common.c -lgmp -lm \
            -o build/benchmark_direct_convergence_window
      - name: Sweep convergence-window size
        run: |
          set -euo pipefail
          rm -rf /dev/shm/rj_cw
          mkdir -p /dev/shm/rj_cw/build
          cp build/benchmark_direct_convergence_window /dev/shm/rj_cw/
          cd /dev/shm/rj_cw
          ./benchmark_direct_convergence_window 10000 64 >/dev/null
          echo 'block,digits,chud_bs_s,d2_direct_s,d2_cw_s,chud_direct_s,chud_cw_s,d2_cw_over_d2_direct,d2_cw_over_chud_cw,equal' > summary.csv
          for block in 16 32 64 128 256; do
            row=$(./benchmark_direct_convergence_window 100000 "$block" | tail -n 1)
            echo "$block,$(echo "$row" | cut -d, -f1),$(echo "$row" | cut -d, -f3-9),$(echo "$row" | awk -F, '{print ($10&&$11&&$12&&$13)?1:0}')" >> summary.csv
          done
          cat summary.csv
          cp summary.csv "$GITHUB_WORKSPACE/build/"
      - uses: actions/upload-artifact@v4
        with:
          name: direct-convergence-window
          path: build/summary.csv
