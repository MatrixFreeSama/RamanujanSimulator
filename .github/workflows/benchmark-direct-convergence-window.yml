name: Direct convergence-window benchmark

on:
  pull_request:
    branches: [ main ]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libgmp-dev
      - name: Build CWDR benchmark
        run: |
          mkdir -p build
          gcc -O3 -march=native -std=c17 -Wall -Wextra -Wpedantic \
            -Isrc -Ivalidation validation/benchmark_direct_convergence_window.c \
            src/ramanujan_c_common.c -lgmp -lm \
            -o build/benchmark_direct_convergence_window
      - name: Diagnose correctness
        run: |
          set -euo pipefail
          rm -rf /dev/shm/rj_cw
          mkdir -p /dev/shm/rj_cw/build
          cp build/benchmark_direct_convergence_window /dev/shm/rj_cw/
          cd /dev/shm/rj_cw
          echo 'digits,block,chud_bs_s,d2_direct_s,d2_cw_s,chud_direct_s,chud_cw_s,d2_cw_over_d2_direct,d2_cw_over_chud_cw,eq_d2_base,eq_d2_cw,eq_chud_base,eq_chud_cw' > summary.csv
          for digits in 10000 30000; do
            for block in 16 64 256; do
              row=$( (./benchmark_direct_convergence_window "$digits" "$block" || true) | tail -n 1)
              echo "$row" >> summary.csv
            done
          done
          cat summary.csv
          cp summary.csv "$GITHUB_WORKSPACE/build/"
      - uses: actions/upload-artifact@v4
        with:
          name: direct-convergence-window
          path: build/summary.csv
