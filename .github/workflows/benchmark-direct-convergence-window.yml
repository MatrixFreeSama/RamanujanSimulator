name: Direct convergence-window benchmark

on:
  pull_request:
    branches: [ main ]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libgmp-dev
      - name: Build CTDR benchmark
        run: |
          mkdir -p build
          gcc -O3 -march=native -std=c17 -Wall -Wextra -Wpedantic \
            -Isrc -Ivalidation validation/benchmark_direct_convergence_window.c \
            src/ramanujan_c_common.c -lgmp -lm \
            -o build/benchmark_direct_convergence_window
      - name: High precision validation
        run: |
          set -euo pipefail
          rm -rf /dev/shm/rj_ct
          mkdir -p /dev/shm/rj_ct/build
          cp build/benchmark_direct_convergence_window /dev/shm/rj_ct/
          cd /dev/shm/rj_ct
          echo 'digits,block,chud_bs_s,d2_direct_s,d2_ct_s,chud_direct_s,chud_ct_s,d2_ct_over_d2_direct,d2_ct_over_chud_ct,eq_d2_base,eq_d2_ct,eq_chud_base,eq_chud_ct' > summary.csv
          for spec in '100000 16' '100000 64' '200000 16' '200000 64'; do
            set -- $spec
            row=$(./benchmark_direct_convergence_window "$1" "$2" | tail -n 1)
            echo "$row" >> summary.csv
          done
          cat summary.csv
          awk -F, 'NR>1 { if (!($10 && $11 && $12 && $13)) exit 1 }' summary.csv
          cp summary.csv "$GITHUB_WORKSPACE/build/"
      - uses: actions/upload-artifact@v4
        with:
          name: direct-convergence-window
          path: build/summary.csv
